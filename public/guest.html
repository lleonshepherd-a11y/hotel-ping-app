<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Concierge — Noir House Hotel</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Roboto,sans-serif;
    color:#1f1c17;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 20px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{background:rgba(184,151,92,.28)}
  button{-webkit-tap-highlight-color:transparent}

  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }

  .brand{flex:none;padding-top:calc(34px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:10px;animation:riseIn .5s cubic-bezier(.22,.85,.35,1) both}
  .brand-mark{width:40px;height:40px;border-radius:11px;overflow:hidden;box-shadow:0 8px 20px -8px rgba(31,28,23,.28),0 0 0 1px rgba(31,28,23,.06)}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand-tag{font-size:11px;font-weight:700;letter-spacing:.24em;color:rgba(31,28,23,.38);text-transform:uppercase}

  .hero{text-align:center;margin:28px 0 24px;max-width:400px;width:100%;animation:riseIn .55s cubic-bezier(.22,.85,.35,1) .05s both}
  .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#a3823f;margin-bottom:9px}
  .hero-room{font-family:Manrope,sans-serif;font-weight:800;font-size:36px;letter-spacing:-.025em;color:#1f1c17;text-wrap:balance}
  .hero-rule{width:36px;height:2px;background:linear-gradient(90deg,rgba(184,151,92,0),rgba(184,151,92,.9),rgba(184,151,92,0));margin:13px auto}
  .hero-sub{font-size:13.5px;color:rgba(31,28,23,.5);font-weight:500;letter-spacing:-.005em}

  .panel{
    width:100%;max-width:400px;background:#fff;border:1px solid rgba(31,28,23,.06);border-radius:22px;
    padding:18px 18px 16px;box-shadow:0 1px 2px rgba(31,28,23,.04),0 22px 48px -28px rgba(31,28,23,.24);
    margin-bottom:24px;animation:riseIn .55s cubic-bezier(.22,.85,.35,1) .1s both;
  }
  .panel-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(31,28,23,.38);margin-bottom:9px}
  .panel textarea{
    width:100%;min-height:60px;max-height:200px;border-radius:14px;border:1.5px solid rgba(31,28,23,.1);
    background:#f8f5ef;font-size:16px;color:#1f1c17;padding:13px 14px;margin-bottom:12px;line-height:1.45;
    font-family:inherit;resize:none;overflow-y:hidden;
    transition:border-color .15s ease,background-color .15s ease,box-shadow .15s ease;
  }
  .panel textarea::placeholder{color:rgba(31,28,23,.3)}
  .panel textarea:focus{
    outline:none;border-color:rgba(184,151,92,.75);background:#fff;
    box-shadow:0 0 0 3.5px rgba(184,151,92,.14);
  }
  .send-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(150deg,#d9bb8b,#b8975c);color:#2a2013;font-size:14.5px;font-weight:800;
    letter-spacing:.005em;cursor:pointer;font-family:inherit;
    box-shadow:0 1px 1px rgba(255,255,255,.4) inset,0 10px 22px -12px rgba(184,151,92,.65);
    transition:transform .12s cubic-bezier(.3,1,.4,1),box-shadow .12s ease,opacity .15s ease;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .send-btn:active{transform:scale(.975);box-shadow:0 1px 1px rgba(255,255,255,.4) inset,0 6px 14px -10px rgba(184,151,92,.65)}
  .send-btn:disabled{opacity:.6;cursor:default;transform:none}
  .send-spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(42,32,19,.25);border-top-color:#2a2013;animation:spin .7s linear infinite;display:none}
  .send-btn.sending .send-spinner{display:inline-block}
  .send-btn.sending .send-label{opacity:.85}
  @keyframes spin{to{transform:rotate(360deg)}}
  .form-error{font-size:12.5px;color:#c0392b;font-weight:600;margin-top:10px;min-height:1px;text-align:center}

  .list-wrap{width:100%;max-width:400px;animation:riseIn .55s cubic-bezier(.22,.85,.35,1) .15s both}
  .list-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:rgba(31,28,23,.38);margin-bottom:11px}
  .req-empty{font-size:12.5px;color:rgba(31,28,23,.38);text-align:center;padding:22px 0;border:1.5px dashed rgba(31,28,23,.1);border-radius:16px}
  .req-card{
    background:#fff;border:1px solid rgba(31,28,23,.06);border-radius:17px;padding:14px 16px;margin-bottom:11px;
    box-shadow:0 1px 2px rgba(31,28,23,.03),0 12px 28px -20px rgba(31,28,23,.2);
    animation:popIn .35s cubic-bezier(.26,1.1,.4,1) both;
  }
  .req-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .req-text{font-size:13.5px;color:#1f1c17;font-weight:600;line-height:1.4}
  .req-pill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:20px;white-space:nowrap;flex:none;margin-top:1px}
  .req-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .req-pill.new{background:rgba(224,144,44,.13);color:#b5701f}
  .req-pill.in_progress{background:rgba(24,119,242,.11);color:#1877f2}
  .req-pill.completed{background:rgba(47,154,92,.13);color:#2f9a5c}
  .req-time{font-size:11.5px;color:rgba(31,28,23,.36);margin-top:6px;font-variant-numeric:tabular-nums}
  .req-reply-rule{border-top:1px solid rgba(31,28,23,.07);margin:10px 0 9px}
  .req-reply{font-size:13px;color:rgba(31,28,23,.65);line-height:1.55;font-style:italic}

  .footer{flex:none;text-align:center;font-size:11.5px;color:rgba(31,28,23,.35);font-weight:500;padding:18px 20px 6px}
  .no-room{max-width:340px;text-align:center;margin-top:120px;font-size:14px;color:rgba(31,28,23,.55);line-height:1.6}
</style>
</head>
<body>

<div class="brand">
  <div class="brand-mark"><img src="hotel-ping-logo-tight.png" alt="Noir House Hotel logo"></div>
  <div class="brand-tag">Noir House Hotel</div>
</div>

<div id="app" hidden style="width:100%;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;overflow-y:auto">
  <div class="hero">
    <div class="hero-eyebrow">Concierge</div>
    <div class="hero-room" id="roomLabel">Room</div>
    <div class="hero-rule"></div>
    <div class="hero-sub">How can we help you today?</div>
  </div>

  <form class="panel" id="requestForm">
    <div class="panel-label">New request</div>
    <textarea id="requestText" rows="1" placeholder="A taxi for 7pm, a dinner reservation, extra towels&hellip;" maxlength="500" required></textarea>
    <button type="submit" class="send-btn" id="sendBtn">
      <span class="send-spinner"></span>
      <span class="send-label">Send request</span>
    </button>
    <div class="form-error" id="formError"></div>
  </form>

  <div class="list-wrap">
    <div class="list-label">Your requests</div>
    <div id="reqList"></div>
  </div>
</div>

<div id="noRoom" class="no-room" hidden>This link is missing a room number. Please scan the QR code in your room again, or ask reception for help.</div>

<div class="footer">Concierge, whenever you need us</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var room = (params.get("room") || "").trim();
  var appEl = document.getElementById("app");
  var noRoomEl = document.getElementById("noRoom");
  if(!room){ noRoomEl.hidden = false; return; }
  appEl.hidden = false;
  document.getElementById("roomLabel").textContent = "Room " + room;

  var STORE_KEY = "hp_guest_requests_" + room;
  function loadIds(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }catch(e){ return []; } }
  function saveIds(ids){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(ids)); }catch(e){} }

  var requests = {}; // id -> request object
  var order = loadIds();

  function esc(s){ return (s||"").replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
  function fmtTime(iso){
    var d = new Date(iso);
    return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }
  var STATUS_LABEL = { new: "Received", in_progress: "In progress", completed: "Completed" };

  function render(){
    var listEl = document.getElementById("reqList");
    var items = order.map(function(id){ return requests[id]; }).filter(Boolean);
    if(!items.length){
      listEl.innerHTML = '<div class="req-empty">No requests yet</div>';
      return;
    }
    listEl.innerHTML = items.map(function(r){
      var html = '<div class="req-card">' +
        '<div class="req-head"><span class="req-text">' + esc(r.text) + '</span>' +
        '<span class="req-pill ' + r.status + '">' + STATUS_LABEL[r.status] + '</span></div>' +
        '<div class="req-time">Sent ' + fmtTime(r.createdAt) + '</div>';
      if(r.status === "completed" && r.replyText){
        html += '<div class="req-reply-rule"></div><div class="req-reply">“' + esc(r.replyText) + '”</div>';
      }
      html += '</div>';
      return html;
    }).join("");
  }

  function pollRequest(id){
    fetch('/api/guest-requests/' + encodeURIComponent(id)).then(function(res){
      if(!res.ok) return null;
      return res.json();
    }).then(function(data){
      if(data && data.request){
        requests[id] = data.request;
        render();
      }
    }).catch(function(){});
  }

  function pollAll(){ order.forEach(pollRequest); }

  // seed from any ids already stored, then poll
  order.forEach(function(id){ requests[id] = requests[id] || { text: "", status: "new", createdAt: new Date().toISOString() }; });
  render();
  pollAll();
  setInterval(pollAll, 12000);

  var form = document.getElementById("requestForm");
  var textEl = document.getElementById("requestText");
  var sendBtn = document.getElementById("sendBtn");
  var errorEl = document.getElementById("formError");

  function autoGrow(){
    textEl.style.height = "auto";
    textEl.style.height = Math.min(textEl.scrollHeight, 200) + "px";
  }
  textEl.addEventListener("input", autoGrow);
  autoGrow();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var text = textEl.value.trim();
    if(!text) return;
    errorEl.textContent = "";
    sendBtn.disabled = true;
    sendBtn.classList.add("sending");
    fetch('/api/guest-requests', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ roomNumber: room, text: text }),
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error(data.error || "Couldn't send that");
        return data;
      });
    }).then(function(data){
      var r = data.request;
      requests[r.id] = r;
      order.unshift(r.id);
      saveIds(order);
      render();
      textEl.value = "";
      autoGrow();
    }).catch(function(err){
      errorEl.textContent = err.message || "Couldn't send that. Please try again.";
    }).finally(function(){
      sendBtn.disabled = false;
      sendBtn.classList.remove("sending");
    });
  });
})();
</script>
</body>
</html>
