<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Message Dash</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Hotel Ping">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe2e8;
  --surface:#f6f6f4;
  --surface-2:#eeeeec;
  --surface-3:#e6e7e6;
  --border:#dcdcda;
  --text:#242420;
  --text-dim:#726f68;
  --text-faint:#9d9a92;
  --accent:#3474c4;
  --accent-2:#2a5ea3;
  --urgent:#d6493c;
  --urgent-2:#b93a2f;
  --urgent-tint:#f7e9e6;
  --bubble-in:#e6e6e2;
  --bubble-in-text:#242420;
  --sidebar-bg:#efefec;
  --active-tint:rgba(52,116,196,.09);
  --active-tint-strong:rgba(52,116,196,.15);
  --shadow-soft:0 1px 2px rgba(30,28,20,.05), 0 8px 22px rgba(30,28,20,.07);
  --shadow-pop:0 22px 54px rgba(30,28,20,.16), 0 4px 14px rgba(30,28,20,.08);
  --wallpaper-dot:rgba(36,36,32,.045);
}
/* Message Dash is a fixed white/light design — it does not switch to a dark palette. */

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:radial-gradient(ellipse 1100px 700px at 22% -8%, #eceeec 0%, var(--bg) 55%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Roboto,"Manrope",sans-serif;
  position:fixed;
  inset:0;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(128,128,140,.28);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus,:focus-visible{outline:none}
textarea,input,select,button{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important} }

.app{
  display:grid;
  grid-template-columns:300px 1fr;
  grid-template-rows:minmax(0,1fr);
  width:100%;
  height:calc(100vh - 40px);
  max-height:800px;
  max-width:1180px;
  background:var(--surface);
  box-shadow:var(--shadow-pop);
  border-radius:28px;
  overflow:hidden;
}

/* ---------- Sidebar ---------- */
.sidebar{
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, var(--sidebar-bg)) 0%, var(--sidebar-bg) 220px);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  box-shadow:1px 0 0 var(--border), 6px 0 24px -18px rgba(20,20,16,.5);
  position:relative;
  z-index:1;
}
.sb-head{padding:26px 20px 18px}
.sb-brand{display:flex;align-items:center;gap:12px}
.sb-mark{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center}
.sb-mark img{width:100%;height:100%;object-fit:contain;display:block;border-radius:14px;box-shadow:0 8px 20px -4px rgba(15,15,17,.5)}
.sb-mark svg{width:21px;height:21px}
.sb-title{font-family:Manrope,sans-serif;font-weight:800;font-size:17.5px;letter-spacing:-.015em}
.sb-sub{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:1px}

.sb-switcher{padding:16px 20px 8px}
.sb-switcher-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:11px}
.switcher-row{display:flex;flex-wrap:wrap;gap:9px}
.sw-chip{flex:none;width:42px;height:42px;border-radius:50%;border:2.5px solid transparent;background:none;padding:0;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.3,1.4,.4,1)}
.sw-chip:hover{transform:translateY(-1px) scale(1.04)}
.sw-chip.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--active-tint)}
.sw-chip.active .sw-avatar{background:linear-gradient(150deg,var(--accent),var(--accent-2)) !important;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw-avatar svg{width:16px;height:16px}

.duty-row{margin:16px 16px 0}
.duty-caption{display:flex;align-items:center;margin-bottom:9px}
.duty-status-pill{font-size:10px;font-weight:800;padding:2px 9px;border-radius:10px;background:var(--active-tint-strong);color:var(--accent);transition:background .2s ease,color .2s ease}
.duty-status-pill.off{background:var(--urgent-tint);color:var(--urgent)}

.duty-switch-row{display:flex;align-items:center;justify-content:flex-end}

.duty-track{
  position:relative;flex:none;width:58px;height:32px;border-radius:16px;
  background:linear-gradient(150deg,#3fa66a,#2c8350);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
  overflow:visible;transition:background .25s ease;
}
.duty-track.off{background:linear-gradient(150deg,var(--urgent),var(--urgent-2))}
.duty-knob{
  position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);box-shadow:0 2px 6px rgba(20,20,16,.3), inset 0 0 0 1px var(--border);
  display:flex;align-items:center;justify-content:center;color:#2c8350;
  cursor:grab;touch-action:none;transition:left .22s cubic-bezier(.3,1.3,.4,1),background .2s ease,color .2s ease;
}
.duty-knob:active{cursor:grabbing}
.duty-track.dragging .duty-knob{transition:background .2s ease,color .2s ease}
.duty-knob:focus-visible{outline:none}
.duty-knob svg{width:14px;height:14px}
.duty-track.off .duty-knob{color:var(--urgent)}

.sb-search{
  display:flex;align-items:center;gap:8px;margin:14px 16px 0;padding:8px 12px;
  background:var(--surface-2);border-radius:14px;box-shadow:inset 0 0 0 1px var(--border);
  color:var(--text-faint);transition:box-shadow .15s ease;
}
.sb-search svg{width:16px;height:16px;flex:none}
.sb-search input{flex:1;border:none;background:none;font-size:16px;color:var(--text);min-width:0;font-family:inherit}
.sb-search input::placeholder{color:var(--text-faint)}
.sb-search input:focus{outline:none}
.sb-search button{flex:none;border:none;background:none;color:var(--text-faint);display:flex;align-items:center;justify-content:center;padding:2px}
.sb-search button svg{width:13px;height:13px}
.sb-empty{padding:24px 20px;text-align:center;font-size:12.5px;color:var(--text-faint);line-height:1.5}
.sb-list-label{padding:18px 20px 9px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint)}
.thread-list{flex:1;overflow-y:auto;padding:0 10px 14px}
.thread-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 10px;border-radius:15px;border:none;background:none;width:100%;text-align:left;color:inherit;
  transition:background .12s ease,transform .1s ease;
}
.thread-item:hover{background:var(--surface-3)}
.thread-item.active{background:var(--active-tint)}
.t-avatar{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 2px 6px rgba(15,15,20,.18)}
.t-avatar svg{width:19px;height:19px}
.t-avatar.urgent-ring::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--urgent);animation:ringPulse 1.8s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.t-body{flex:1;min-width:0}
.t-row1{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.t-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-contact{font-weight:600;color:var(--text-faint)}
.t-time{font-size:11px;color:var(--text-faint);flex:none}
.t-row2{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.t-preview{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.thread-item.unread .t-preview{color:var(--text);font-weight:600}
.thread-item.unread .t-name{color:var(--text)}
.t-badge{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.t-badge.urgent{background:var(--urgent)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.thread-head{
  display:flex;align-items:center;gap:13px;
  padding:16px 24px;
  flex:none;
  position:relative;
  z-index:2;
  background:#fff;
}
.back-btn{display:none;border:none;background:none;color:var(--text);padding:4px;border-radius:8px}
.h-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 4px 12px -3px rgba(15,15,20,.35)}
.h-avatar svg{width:19px;height:19px}
.h-name{font-family:Manrope,sans-serif;font-weight:800;font-size:16px;letter-spacing:-.015em}
.h-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:5px}
.h-dot{width:6px;height:6px;border-radius:50%;background:#34c759;transition:background .2s ease}
.h-dot.off{background:var(--text-faint)}

.off-duty-banner{
  flex:none;display:flex;align-items:center;gap:8px;
  margin:12px 22px 0;padding:9px 13px;border-radius:14px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);
  font-size:12.5px;color:var(--text-dim);
}
.off-duty-banner svg{width:15px;height:15px;flex:none;color:var(--text-faint)}
.off-duty-banner b{color:var(--text);font-weight:700}
.h-contact-name{font-weight:700;color:var(--text);cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .12s ease}
.h-contact-name:hover{border-bottom-color:var(--text-faint)}
.h-contact-add{font-size:11.5px;font-weight:700;color:var(--accent);cursor:pointer;border:none;background:none;padding:0;display:inline-flex;align-items:center;gap:3px}
.h-contact-add svg{width:11px;height:11px}
.h-contact-input{font-size:16px;font-weight:700;border:none;border-bottom:1.5px solid var(--accent);background:none;color:var(--text);width:140px;padding:0 0 1px;font-family:inherit}
.h-contact-input:focus{outline:none}

.thread-scroll{
  flex:1;overflow-y:auto;padding:20px 22px 10px;display:flex;flex-direction:column;gap:2px;
  background-color:#fff;
  background-image:radial-gradient(var(--wallpaper-dot) 1px, transparent 1px);
  background-size:22px 22px;
  background-position:-4px -4px;
  scrollbar-width:none;
}
.thread-scroll::-webkit-scrollbar{display:none}
.day-div{text-align:center;font-size:11px;font-weight:700;color:var(--text-faint);margin:14px 0 10px;text-transform:uppercase;letter-spacing:.04em}

.msg-row{display:flex;margin:1.5px 0;position:relative;animation:bubbleIn .3s cubic-bezier(.2,.8,.3,1) both}
.msg-row.group-end{margin-bottom:9px}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.msg-row.out{justify-content:flex-end}
.msg-row.in{justify-content:flex-start}
.bubble-wrap{max-width:72%;display:flex;flex-direction:column;position:relative}
.msg-row.out .bubble-wrap{align-items:flex-end;padding-right:7px}
.msg-row.in .bubble-wrap{align-items:flex-start;padding-left:7px}

.bubble{
  position:relative;
  padding:9px 14px;border-radius:19px;font-size:14.5px;line-height:1.38;
  box-shadow:var(--shadow-soft);
  word-wrap:break-word; white-space:pre-wrap;
}
.msg-row.in .bubble{background:var(--bubble-in);color:var(--bubble-in-text)}
.msg-row.out .bubble{background:var(--accent);color:#fff}
.msg-row.in.urgent .bubble{background:var(--urgent);color:#fff}
.msg-row.group-end.in .bubble{border-bottom-left-radius:6px}
.msg-row.group-end.out .bubble{border-bottom-right-radius:6px}
.msg-row .urgent-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--urgent);background:var(--urgent-tint);padding:3px 9px 3px 7px;border-radius:20px;margin-bottom:5px}
.msg-row.in.urgent .urgent-tag{color:var(--urgent)}
.msg-time{font-size:10.5px;color:var(--text-faint);margin-top:4px;padding:0 4px}
.msg-status{font-size:10.5px;color:var(--text-faint);margin-top:3px;padding:0 4px;display:flex;align-items:center;gap:3px}
.msg-status .ticks{display:inline-flex;color:var(--text-faint)}
.msg-status.read .ticks{color:var(--accent)}
.msg-status .ticks svg{width:15px;height:10px}

.bubble.img-bubble{padding:5px;border-radius:19px;overflow:hidden;max-width:280px}
.bubble.img-bubble img{display:block;width:100%;border-radius:15px}
.bubble.img-bubble .cap{padding:7px 8px 4px;font-size:13.5px}

.bubble.file-bubble{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.msg-row.out .bubble.file-bubble{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.22)}
.file-ic{width:34px;height:34px;border-radius:9px;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center}
.file-ic svg{width:16px;height:16px}
.file-meta b{display:block;font-size:13px;font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta span{font-size:11px;opacity:.75}

.bubble.audio-bubble{display:flex;align-items:center;gap:10px;padding:9px 13px 9px 9px;min-width:200px}
.play-btn{width:32px;height:32px;border-radius:50%;border:none;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);color:inherit}
.msg-row.in .play-btn{background:rgba(20,20,26,.08)}
.play-btn svg{width:14px;height:14px}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:22px;position:relative;overflow:hidden}
.wave-bar{width:2.5px;border-radius:2px;background:currentColor;opacity:.4;flex:none}
.wave-progress{position:absolute;inset:0;overflow:hidden;width:0%;display:flex;align-items:center;gap:2px}
.wave-progress .wave-bar{opacity:1}
.audio-dur{font-size:11px;font-weight:600;flex:none;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}

.bubble button.read-aloud-btn{display:inline-flex;vertical-align:-2px;margin-left:6px;width:15px;height:15px;padding:0;border:none;background:none;color:inherit;opacity:.55;cursor:pointer}
.bubble button.read-aloud-btn:hover{opacity:1}
.bubble button.read-aloud-btn svg{width:100%;height:100%}

.voice-transcript-wrap{margin-top:4px;padding:0 3px;max-width:260px}
.voice-transcript-toggle{font-size:11px;font-weight:700;color:var(--accent);background:none;border:none;padding:0;cursor:pointer}
.voice-transcript-text{margin-top:5px;font-size:12.5px;line-height:1.4;color:var(--text-dim);background:var(--surface-2);border-radius:12px;padding:8px 11px}

/* ---------- Composer ---------- */
.composer-wrap{
  flex:none;padding:14px 20px 20px;background:#fff;
  position:relative;z-index:2;
}
.composer{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface-2);border:none;
  border-radius:24px;padding:6px 7px 6px 12px;
  max-width:640px;margin:0 auto;
}
.composer.urgent-mode{background:var(--urgent-tint)}
.icon-btn{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:none;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:background .12s ease,color .12s ease,transform .1s ease}
.icon-btn:active{transform:scale(.9)}
.send-btn:active{transform:scale(.9)}
.thread-item:active{transform:scale(.985)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.on{color:var(--urgent);background:rgba(255,59,48,.12)}

.plus-wrap{position:relative;flex:none}
.plus-btn{transition:background .12s ease,color .12s ease,transform .2s cubic-bezier(.3,1.4,.4,1)}
.plus-btn.open{transform:rotate(45deg);background:var(--surface-3);color:var(--text)}
.plus-menu{
  position:absolute;bottom:calc(100% + 10px);left:0;
  display:flex;gap:6px;padding:8px;
  background:var(--surface);border-radius:20px;
  box-shadow:0 10px 28px -8px rgba(20,20,16,.28), 0 2px 8px rgba(20,20,16,.08), inset 0 0 0 1px var(--border);
  transform-origin:20px 100%;
  transform:scale(.4);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.32,1.5,.4,1), opacity .16s ease;
}
.plus-menu.open{transform:scale(1);opacity:1;pointer-events:auto}
.plus-opt{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border:none;background:none;padding:6px 8px;border-radius:14px;
  transition:background .12s ease,transform .12s ease;
}
.plus-opt:hover{background:var(--surface-3)}
.plus-opt:active{transform:scale(.93)}
.plus-opt-ic{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
#optPhoto .plus-opt-ic{background:linear-gradient(155deg,#2c2c30,#131315);color:#fff;box-shadow:0 3px 8px -2px rgba(15,15,17,.45)}
#optCamera .plus-opt-ic{background:linear-gradient(155deg,#2c2c30,#131315);color:#fff;box-shadow:0 3px 8px -2px rgba(15,15,17,.45)}
#optVoice .plus-opt-ic{background:linear-gradient(145deg,#9b6ef3,#7a45d8);color:#fff;box-shadow:0 3px 8px -2px rgba(122,69,216,.5)}
#optUrgent .plus-opt-ic{background:linear-gradient(145deg,var(--urgent),var(--urgent-2));color:#fff;box-shadow:0 3px 8px -2px rgba(214,73,60,.5)}
.plus-opt-ic svg{width:17px;height:17px}
.plus-opt-label{font-size:10.5px;font-weight:700;color:var(--text-dim);white-space:nowrap}
.plus-opt#optUrgent.active .plus-opt-ic{box-shadow:0 0 0 3px var(--urgent-tint), 0 3px 8px -2px rgba(214,73,60,.5)}
.plus-opt#optUrgent.active .plus-opt-label{color:var(--urgent)}
#msgInput{
  flex:1;border:none;background:none;resize:none;color:var(--text);
  font-size:16px;line-height:1.35;padding:7px 2px;max-height:120px;min-height:20px;
}
#msgInput:focus-visible{outline:none}
#msgInput::placeholder{color:var(--text-faint)}
.send-btn{
  flex:none;width:0;height:34px;border-radius:50%;border:none;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));color:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  opacity:0;transform:scale(.4);margin-left:-8px;box-shadow:none;
  transition:width .22s cubic-bezier(.3,1.4,.4,1), opacity .16s ease, transform .22s cubic-bezier(.3,1.4,.4,1), margin-left .22s cubic-bezier(.3,1.4,.4,1), box-shadow .15s ease;
}
.send-btn.ready{width:34px;opacity:1;transform:scale(1);margin-left:0;box-shadow:0 6px 14px -3px rgba(52,116,196,.55)}
.send-btn.ready.urgent{background:linear-gradient(150deg,var(--urgent),var(--urgent-2));box-shadow:0 6px 14px -3px rgba(214,73,60,.55)}
.mic-quick{width:34px;opacity:1;transform:scale(1);margin-left:0;background:var(--surface-3);color:var(--text-dim);box-shadow:none}
.mic-quick:hover{background:var(--surface-3);color:var(--text)}
.mic-quick.hide{width:0;opacity:0;transform:scale(.4);margin-left:-8px}
.send-btn svg{width:16px;height:16px}

.attach-preview{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
.attach-preview img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none}
.attach-preview .file-ic{width:38px;height:38px}
.attach-preview .ap-meta{flex:1;min-width:0}
.attach-preview .ap-meta b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-preview .ap-meta span{font-size:11px;color:var(--text-dim)}
.ap-remove{flex:none;width:26px;height:26px;border-radius:50%;border:none;background:var(--surface-3);color:var(--text-dim);display:flex;align-items:center;justify-content:center}
.ap-remove svg{width:13px;height:13px}

.rec-row,.vp-row{display:flex;align-items:center;gap:10px;width:100%}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--urgent);flex:none;animation:recPulse 1.1s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.rec-timer{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;min-width:38px}
.rec-bars{flex:1;display:flex;align-items:center;gap:2.5px;height:22px;overflow:hidden}
.rec-bars span{width:3px;border-radius:2px;background:var(--urgent);flex:none;animation:recBar .7s ease-in-out infinite}
@keyframes recBar{0%,100%{height:5px}50%{height:20px}}
.rec-cancel,.rec-stop{flex:none;font-size:13px;font-weight:700;border:none;background:none;padding:6px 10px;border-radius:14px}
.rec-cancel{color:var(--text-dim)}
.rec-stop{color:#fff;background:var(--urgent)}
.vp-trash{flex:none;width:32px;height:32px;border-radius:50%;border:none;background:var(--surface-3);color:var(--text-dim);display:flex;align-items:center;justify-content:center}
.vp-trash svg{width:15px;height:15px}
.vp-audio{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-3);border-radius:16px;padding:6px 12px}
.vp-transcript-preview{font-size:11.5px;color:var(--text-dim);padding:0 2px 2px;line-height:1.35}
.hint{font-size:11px;color:var(--text-faint);margin-top:7px;padding-left:4px;transition:color .15s ease}
.hint.warn{color:var(--urgent);font-weight:600}
.composer.shake{animation:composerShake .4s ease}
@keyframes composerShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

[hidden]{display:none !important}

/* ---------- Login screen ---------- */
.login-screen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 900px 600px at 50% 0%, #202020 0%, #0a0a0a 60%);color:#fff}
.login-card{width:340px;max-width:calc(100vw - 40px);text-align:center}
.login-mark{width:72px;height:72px;margin:0 auto 22px}
.login-mark img{width:100%;height:100%;object-fit:contain;border-radius:18px;box-shadow:0 14px 34px -10px rgba(0,0,0,.75)}
.login-title{font-family:Manrope,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em;color:#fff}
.login-sub{font-size:12.5px;color:rgba(255,255,255,.5);font-weight:600;margin-top:4px;margin-bottom:30px;text-transform:uppercase;letter-spacing:.08em}
.login-field{text-align:left;margin-bottom:14px}
.login-field label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:7px}
.login-field input{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:16px;color:#fff}
.login-field input::placeholder{color:rgba(255,255,255,.28)}
.login-field input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.1)}
.login-pin-input{letter-spacing:.4em;font-weight:700;font-variant-numeric:tabular-nums}
.login-btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:14px;background:#fff;color:#0a0a0a;font-size:14.5px;font-weight:800;letter-spacing:.01em;transition:opacity .15s ease}
.login-btn:disabled{opacity:.4}
.login-btn:not(:disabled):hover{opacity:.88}
.login-error{font-size:12.5px;color:#ff6a5c;font-weight:600;margin-top:14px;min-height:16px}

/* ---------- Admin panel ---------- */
.admin-btn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:6px 10px;margin:0 20px 14px}
.admin-btn svg{width:13px;height:13px}
.signed-in-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 20px;font-size:11.5px;color:var(--text-faint);font-weight:600}
.signed-in-row strong{color:var(--text);font-weight:700}
.logout-btn{font-size:11.5px;font-weight:700;color:var(--text-dim);background:none;border:none;text-decoration:underline;padding:0}
.admin-overlay{position:fixed;inset:0;z-index:40;background:rgba(20,18,14,.4);display:flex;align-items:center;justify-content:center}
.admin-modal{width:520px;max-width:calc(100vw - 40px);max-height:calc(100vh - 80px);overflow:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-pop);padding:24px}
.admin-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.admin-modal-head h2{font-family:Manrope,sans-serif;font-size:16.5px;font-weight:800;margin:0}
.admin-close{border:none;background:var(--surface-3);width:28px;height:28px;border-radius:50%;color:var(--text-dim);display:flex;align-items:center;justify-content:center}
.admin-close svg{width:14px;height:14px}
.staff-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.staff-row-name{font-weight:700;font-size:13.5px;flex:1}
.staff-row-name-text{cursor:pointer;border-bottom:1px dashed var(--border)}
.staff-row-name-text:hover{color:var(--accent)}
.staff-row-name-input{font-size:16px;font-weight:700;font-family:inherit;border:1.5px solid var(--accent);border-radius:6px;padding:1px 5px;width:140px}
.staff-row-name span{display:block;font-weight:600;font-size:11.5px;color:var(--text-faint)}
.staff-row select{font-size:12.5px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);transition:border-color .15s ease}
.staff-row select:focus{outline:none}
.staff-row-admin{font-size:10.5px;font-weight:700;color:var(--accent);background:var(--active-tint);padding:3px 7px;border-radius:8px}
.staff-row-del{border:none;background:none;color:var(--text-faint);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.staff-row-del:hover{color:var(--urgent);background:var(--urgent-tint)}
.staff-row-del svg{width:14px;height:14px}
.admin-add-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.admin-add-form input,.admin-add-form select{padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);font-size:16px;transition:border-color .15s ease}
.admin-add-form input:focus,.admin-add-form select:focus{outline:none}
.admin-add-form input[name="name"]{flex:1;min-width:110px}
.admin-add-form input[name="pin"]{width:90px}
.admin-add-btn{border:none;border-radius:10px;background:linear-gradient(150deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-size:12.5px;padding:9px 14px}
.admin-add-error{width:100%;font-size:12px;color:var(--urgent);font-weight:600}

@media (max-width:720px){
  body{padding:0}
  .app{grid-template-columns:1fr;max-width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}
  .sidebar{position:fixed;inset:0;z-index:5;transition:transform .28s cubic-bezier(.3,1,.4,1)}
  .sidebar.hide-mobile{transform:translateX(-100%)}
  .main{position:fixed;inset:0;z-index:4;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,1,.4,1)}
  .main.show-mobile{transform:translateX(0)}
  .back-btn{display:flex}
  .bubble-wrap{max-width:84%}
}

function shadeColor(hex, pct){
  var n = parseInt(hex.slice(1), 16);
  var r = Math.max(0, Math.min(255, ((n>>16)&255) + Math.round(255*pct/100)));
  var g = Math.max(0, Math.min(255, ((n>>8)&255) + Math.round(255*pct/100)));
  var b = Math.max(0, Math.min(255, (n&255) + Math.round(255*pct/100)));

var AUTH = { token: null, staff: null };
function authHeaders(extra){

  if(AUTH.token) h['Authorization'] = 'Bearer ' + AUTH.token;

}
function apiGet(path){
  return fetch(path, { headers: authHeaders() }).then(function(r){ return r.json().then(function(body){ return r.ok ? body : Promise.reject(new Error(body.error || 'Request failed')); }); });
}
function apiSend(path, method, body){
  return fetch(path, { method: method, headers: authHeaders({'Content-Type':'application/json'}), body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(json){ return r.ok ? json : Promise.reject(new Error(json.error || 'Request failed')); }); });
}
function apiDelete(path){

    .then(function(r){ return r.json().then(function(json){ return r.ok ? json : Promise.reject(new Error(json.error || 'Request failed')); }); });
}
function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function fmtClock(ts){

function fmtRelative(ts){
  var diff = Math.max(0, Math.round((now - ts)/60000));
  if(diff < 1) return "now";
  if(diff < 60) return diff + "m";
  var h = Math.round(diff/60);
  if(h < 24) return h + "h";
  return Math.round(h/24) + "d";
}
function fmtBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024*1024) return Math.round(n/1024) + " KB";

}

/* ---------------- Audio helpers ---------------- */
function floatTo16BitPCM(view, offset, input){
  for(var i=0;i<input.length;i++,offset+=2){
    var s = Math.max(-1, Math.min(1, input[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
}
function encodeWAV(samples, sampleRate){
  var buffer = new ArrayBuffer(44 + samples.length*2);
  var view = new DataView(buffer);
  function ws(o,s){ for(var i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  ws(0,"RIFF"); view.setUint32(4, 36+samples.length*2, true); ws(8,"WAVE");
  ws(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  ws(36,"data"); view.setUint32(40, samples.length*2, true);
  floatTo16BitPCM(view, 44, samples);
  return new Blob([view], {type:"audio/wav"});
}
function makeToneVoiceNote(durationSec, baseFreq){
  durationSec = durationSec || 4; baseFreq = baseFreq || 210;
  var sampleRate = 22050;
  var OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if(!OfflineCtx) return Promise.resolve(null);
  var ctx = new OfflineCtx(1, Math.floor(sampleRate*durationSec), sampleRate);
  var osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(baseFreq, 0);
  osc.frequency.linearRampToValueAtTime(baseFreq*1.15, durationSec*0.5);
  osc.frequency.linearRampToValueAtTime(baseFreq*0.9, durationSec);
  var gain = ctx.createGain();
  gain.gain.setValueAtTime(0,0);
  gain.gain.linearRampToValueAtTime(0.16, 0.08);
  gain.gain.setValueAtTime(0.16, Math.max(0.09, durationSec-0.3));
  gain.gain.linearRampToValueAtTime(0, durationSec);
  osc.connect(gain).connect(ctx.destination);
  osc.start(0); osc.stop(durationSec);
  return ctx.startRendering().then(function(rendered){
    var data = rendered.getChannelData(0);
    var blob = encodeWAV(data, sampleRate);
    return { url: URL.createObjectURL(blob), duration: durationSec };
  }).catch(function(){ return null; });
}
function playChime(urgent){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var now0 = ctx.currentTime;
    var notes = urgent ? [880,1108,1318] : [740];
    notes.forEach(function(f,i){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = f;
      var t = now0 + i*0.11;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(urgent?0.13:0.08, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t+0.4);
    });
    setTimeout(function(){ ctx.close(); }, 900);
  }catch(e){}
}

function buildAudioNode(msg, holderIsOut){
  var wrap = document.createElement("div");
  wrap.className = "bubble audio-bubble";
  var bars = [];
  for(var i=0;i<20;i++){ bars.push(6 + Math.round(14*Math.abs(Math.sin(i*1.7+ (msg.freq||3)))));}
  var barsHTML = bars.map(function(h){ return '<span class="wave-bar" style="height:'+h+'px"></span>'; }).join("");

  wrap.innerHTML =
    '<button class="play-btn" aria-label="Play voice message">'+
      '<svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'+
      '<svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'+
    '</button>'+
    '<div class="wave"><div class="wave-static" style="display:flex;align-items:center;gap:2px;width:100%">'+barsHTML+'</div>'+
      '<div class="wave-progress"><div style="display:flex;align-items:center;gap:2px">'+barsHTML+'</div></div>'+
    '</div>'+
    '<span class="audio-dur">'+fmtDur(msg.duration||msg.dur||4)+'</span>';

  var audioEl = new Audio();
  audioEl.preload = "none";
  var playBtn = wrap.querySelector(".play-btn");
  var icPlay = wrap.querySelector(".ic-play");
  var icPause = wrap.querySelector(".ic-pause");
  var progress = wrap.querySelector(".wave-progress");
  var durLabel = wrap.querySelector(".audio-dur");
  var totalDur = msg.duration || msg.dur || 4;
  var ready = false;

  function ensureSrc(){
    if(msg.url){ audioEl.src = msg.url; ready = true; return Promise.resolve(); }
    return makeToneVoiceNote(msg.dur, msg.freq).then(function(res){
      if(res){ msg.url = res.url; audioEl.src = res.url; ready = true; }
    });
  }

  playBtn.addEventListener("click", function(){
    if(audioEl.paused){
      var startPlayback = function(){
        audioEl.play().catch(function(){});
      };
      if(!ready){ ensureSrc().then(startPlayback); } else { startPlayback(); }
      icPlay.style.display = "none"; icPause.style.display = "";
    } else {
      audioEl.pause();
      icPlay.style.display = ""; icPause.style.display = "none";
    }
  });
  audioEl.addEventListener("timeupdate", function(){
    var pct = audioEl.duration ? (audioEl.currentTime/audioEl.duration*100) : 0;
    progress.style.width = pct + "%";
    durLabel.textContent = fmtDur(Math.max(0, totalDur - audioEl.currentTime));
  });
  audioEl.addEventListener("ended", function(){
    icPlay.style.display = ""; icPause.style.display = "none";
    progress.style.width = "0%";
    durLabel.textContent = fmtDur(totalDur);
  });
  return wrap;
}
function fmtDur(s){
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s/60), r = s%60;
  return m + ":" + (r<10?"0":"")+r;
}

var dutyTrack = document.getElementById("dutyTrack");
var dutyKnob = document.getElementById("dutyKnob");
var dutyStatusPill = document.getElementById("dutyStatusPill");

function dutyMaxLeft(){ return dutyTrack.clientWidth - 26 - 6; }

function renderDuty(){
  var on = isOnDuty(STATE.self);
  dutyTrack.classList.toggle("off", !on);
  dutyKnob.style.left = (on ? 3 : dutyMaxLeft() + 3) + "px";
  dutyKnob.setAttribute("aria-checked", on ? "true" : "false");
  dutyKnob.setAttribute("aria-label", on ? "On duty. Slide or press Enter to turn the board off" : "Board off. Slide or press Enter to turn it back on");
  dutyStatusPill.textContent = on ? "On duty" : "Off duty";
  dutyStatusPill.classList.toggle("off", !on);
}

(function(){
  var dragging = false, startX = 0, startLeft = 3, moved = false;

  function clamp(v){ return Math.min(dutyMaxLeft() + 3, Math.max(3, v)); }

  function onDown(e){
    dragging = true; moved = false;
    dutyKnob.setPointerCapture(e.pointerId);
    dutyTrack.classList.add("dragging");
    startX = e.clientX;
    startLeft = parseFloat(dutyKnob.style.left) || 3;
  }
  function onMove(e){
    if(!dragging) return;
    var dx = e.clientX - startX;
    if(Math.abs(dx) > 3) moved = true;
    dutyKnob.style.left = clamp(startLeft + dx) + "px";
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    dutyTrack.classList.remove("dragging");
    var left = parseFloat(dutyKnob.style.left) || 3;
    var pct = (left - 3) / dutyMaxLeft();
    var wasOn = isOnDuty(STATE.self);
    var flip = wasOn ? pct > 0.55 : pct < 0.45;
    if(flip && moved) setOnDuty(STATE.self, !wasOn);
    renderDuty();
  }
  dutyKnob.addEventListener("pointerdown", onDown);
  dutyKnob.addEventListener("pointermove", onMove);
  dutyKnob.addEventListener("pointerup", onUp);
  dutyKnob.addEventListener("pointercancel", onUp);
  dutyKnob.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      setOnDuty(STATE.self, !isOnDuty(STATE.self));
      renderDuty();
    }
  });
  window.addEventListener("resize", function(){ if(!dragging) renderDuty(); });
})();

function doSend(){
  var text = msgInput.value.trim();
  if(!text && !STATE.attachment) return;
  if(text && containsProfanity(text)){ blockForLanguage(); return; }
  var deptId = STATE.active;
  var attachment = STATE.attachment;
  var wasUrgent = urgentActive;

  msgInput.value = "";

  renderAttachPreview();

  optUrgent.classList.remove("active");
  composer.classList.remove("urgent-mode");
  refreshSendState();

  var payload = { from: STATE.self, to: deptId, urgent: wasUrgent };
  var sendPromise;
  if(attachment && attachment.type === "image"){
    payload.type = "image"; payload.text = text; payload.fileName = attachment.name;
    sendPromise = blobToBase64(attachment.file).then(function(b64){
      payload.fileBase64 = b64; payload.fileMime = attachment.mime;
      return apiSend('/api/messages', 'POST', payload);
    });
  } else if(attachment && attachment.type === "file"){
    payload.type = "file"; payload.text = text; payload.fileName = attachment.name;
    sendPromise = blobToBase64(attachment.file).then(function(b64){
      payload.fileBase64 = b64; payload.fileMime = attachment.mime;
      return apiSend('/api/messages', 'POST', payload);
    });
  } else {
    payload.type = "text"; payload.text = text;
    sendPromise = apiSend('/api/messages', 'POST', payload);
  }

  sendPromise.then(function(res){
    STATE.data[deptId] = STATE.data[deptId] || [];
    STATE.data[deptId].push(mapServerMessage(res.message, STATE.self));
    renderList();
    if(STATE.active === deptId) renderThread();

/* ---- voice recording ---- */
function setComposerState(s){
  STATE.composer = s;
  composerIdle.hidden = s !== "idle";
  composerRecording.hidden = s !== "recording";
  composerVoicePreview.hidden = s !== "voice-preview";
}


function startRecording(){
  STATE.recChunks = [];
  STATE.recTranscript = "";
  var onStream = function(stream, isSynth, cleanup){
    STATE.recStream = stream;
    STATE.synthCleanup = cleanup || null;
    try{
      STATE.mediaRecorder = new MediaRecorder(stream);
    }catch(e){
      setComposerState("idle");
      return;
    }
    STATE.mediaRecorder.ondataavailable = function(e){ if(e.data.size>0) STATE.recChunks.push(e.data); };
    STATE.mediaRecorder.start();
    STATE.recStart = Date.now();
    setComposerState("recording");
    tickTimer();
    if(!isSynth) startTranscription();
  };

  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      onStream(stream, false, null);
    }).catch(function(){
      synthFallback(onStream);
    });
  } else {
    synthFallback(onStream);
  }
}

function startTranscription(){
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Recognition) return;
  try{
    var rec = new Recognition();
    rec.continuous = true;
    rec.interimResults = false;
    rec.lang = "en-GB";
    rec.onresult = function(e){
      var text = "";
      for(var i=0;i<e.results.length;i++) text += e.results[i][0].transcript;
      STATE.recTranscript = text.trim();
    };
    rec.onerror = function(){};
    rec.start();
    STATE.recRecognition = rec;
  }catch(e){ STATE.recRecognition = null; }
}

function stopTranscription(){
  if(STATE.recRecognition){
    try{ STATE.recRecognition.stop(); }catch(e){}
    STATE.recRecognition = null;
  }
}

function synthFallback(onStream){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var dest = ctx.createMediaStreamDestination();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = 180;
    gain.gain.value = 0.0018;
    osc.connect(gain).connect(dest);
    osc.start();
    onStream(dest.stream, true, function(){ try{osc.stop(); ctx.close();}catch(e){} });
  }catch(e){
    setComposerState("idle");
  }
}

function tickTimer(){
  clearInterval(STATE.recTimerId);
  STATE.recTimerId = setInterval(function(){
    var s = Math.floor((Date.now() - STATE.recStart)/1000);
    var m = Math.floor(s/60), r = s%60;
    recTimer.textContent = m+":"+(r<10?"0":"")+r;
  }, 200);
}

function finishRecording(cancel){
  return new Promise(function(resolve){
    if(!STATE.mediaRecorder){ resolve(null); return; }
    STATE.mediaRecorder.onstop = function(){
      clearInterval(STATE.recTimerId);
      stopTranscription();
      if(STATE.recStream){ STATE.recStream.getTracks().forEach(function(t){ t.stop(); }); }
      if(STATE.synthCleanup){ STATE.synthCleanup(); STATE.synthCleanup = null; }
      if(cancel){ setComposerState("idle"); resolve(null); return; }
      var blob = new Blob(STATE.recChunks, {type: STATE.recChunks[0] ? STATE.recChunks[0].type : "audio/webm"});
      var url = URL.createObjectURL(blob);
      var duration = Math.max(1, Math.round((Date.now() - STATE.recStart)/1000));
      STATE.voice = { url: url, duration: duration, transcript: STATE.recTranscript || null };
      resolve(STATE.voice);
    };
    try{ STATE.mediaRecorder.stop(); }catch(e){ resolve(null); }
  });
}

var pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(function(){
    if(STATE.loading) return;
    var prevIds = {};
    Object.keys(STATE.data).forEach(function(id){
      prevIds[id] = {};
      (STATE.data[id] || []).forEach(function(m){ prevIds[id][m.id] = true; });
    });
    buildData(STATE.self).then(function(data){
      var hasNew = false, hasUrgent = false, changed = false;
      Object.keys(data).forEach(function(id){
        var oldMsgs = STATE.data[id] || [];
        var newMsgs = data[id] || [];
        if(oldMsgs.length !== newMsgs.length) changed = true;
        newMsgs.forEach(function(m){
          if(m.from !== "self" && (!prevIds[id] || !prevIds[id][m.id])){
            hasNew = true;
            if(m.urgent) hasUrgent = true;
          }
        });
      });
      if(!changed) return;
      STATE.data = data;
      renderList();
      if(STATE.active) renderThread();
      if(hasNew && isOnDuty(STATE.self)) playChime(hasUrgent);
    }).catch(function(){});
  }, 4000);
}

  DEPT_ORDER.forEach(function(id){
    var opt = document.createElement("option");
    opt.value = id; opt.textContent = DEPTS[id] ? DEPTS[id].name : id;
    if(id === s.departmentId) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", function(){
    apiSend('/api/staff/' + encodeURIComponent(s.id), 'PATCH', { departmentId: select.value }).catch(function(){
      select.value = s.departmentId;
    });
  });

  var del = document.createElement("button");
  del.className = "staff-row-del";
  del.type = "button";
  del.setAttribute("aria-label", "Remove " + s.name);
  del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
  del.addEventListener("click", function(){
    if(s.id === AUTH.staff.id) return;
    if(!confirm("Remove " + s.name + "?")) return;
    apiDelete('/api/staff/' + encodeURIComponent(s.id)).then(loadStaffList).catch(function(){});
  });
  if(s.id === AUTH.staff.id) del.disabled = true;

  row.appendChild(name);
  row.appendChild(select);
  row.appendChild(del);
  return row;
}

adminBtn.addEventListener("click", openAdmin);
adminClose.addEventListener("click", function(){ adminOverlay.hidden = true; });
adminOverlay.addEventListener("click", function(e){ if(e.target === adminOverlay) adminOverlay.hidden = true; });

addStaffForm.addEventListener("submit", function(e){
  e.preventDefault();
  var fd = new FormData(addStaffForm);
  var name = String(fd.get("name") || "").trim();
  var pin = String(fd.get("pin") || "").trim();
  var departmentId = fd.get("departmentId");
  addStaffError.textContent = "";
  if(!/^\d{4,6}$/.test(pin)){ addStaffError.textContent = "PIN must be 4-6 digits."; return; }
  apiSend('/api/staff', 'POST', { name: name, pin: pin, departmentId: departmentId }).then(function(){
    addStaffForm.reset();
    loadStaffList();
  }).catch(function(err){
    addStaffError.textContent = err.message || "Couldn't add staff.";
  });
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}

})();
</script>
</body>
</html>
