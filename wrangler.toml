name = "hotel-ping-app"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hotel-ping-db"
database_id = "018a4539-a04b-4ada-841d-1962bcde934d"

[[d1_databases]]
binding = "NOIR_DB"
database_name = "noir-house-db"
database_id = "e20a018c-4228-4343-856f-9c80bf3cc8dd"

# Synthetic test hotels used to prove multi-hotel isolation under stress
# (see resolveHotel()/hotelRegistry() in worker.js). Each is a physically
# separate database from DB/NOIR_DB above - not a hotel_id column inside
# them.
[[d1_databases]]
binding = "DB_HOTELB"
database_name = "hotel-ping-db-hotelb"
database_id = "01aa36df-4555-439e-b0f3-5dfdd97a6625"

[[d1_databases]]
binding = "DB_HOTELC"
database_name = "hotel-ping-db-hotelc"
database_id = "b5fd806b-67c5-4d67-a9e4-130b97989811"

[[d1_databases]]
binding = "DB_HOTELD"
database_name = "hotel-ping-db-hoteld"
database_id = "520116b9-f5c6-4dc4-9138-5c38e33b1184"

[[d1_databases]]
binding = "DB_HOTELE"
database_name = "hotel-ping-db-hotele"
database_id = "13009f25-b802-41aa-b24e-b384d3c0fd50"

[[d1_databases]]
binding = "DB_HOTELF"
database_name = "hotel-ping-db-hotelf"
database_id = "3dde8147-9bf9-4470-8190-9272eb29eacb"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "hotel-ping-uploads"

[[r2_buckets]]
binding = "UPLOADS_HOTELB"
bucket_name = "hotel-ping-uploads-hotelb"

[[r2_buckets]]
binding = "UPLOADS_HOTELC"
bucket_name = "hotel-ping-uploads-hotelc"

[[r2_buckets]]
binding = "UPLOADS_HOTELD"
bucket_name = "hotel-ping-uploads-hoteld"

[[r2_buckets]]
binding = "UPLOADS_HOTELE"
bucket_name = "hotel-ping-uploads-hotele"

[[r2_buckets]]
binding = "UPLOADS_HOTELF"
bucket_name = "hotel-ping-uploads-hotelf"

[vars]
VAPID_PUBLIC_KEY = "BCaJBvwGIigjmyBzyh3CgYpzpzbbl4rHeTw3hWLRHp1I52D35oKqQsW2k19ZghGh4evavlwqbAzP-CsuJ-xLBkU"
VAPID_SUBJECT = "mailto:admin@hotelping.co.uk"

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "app.hotelping.co.uk"
custom_domain = true
